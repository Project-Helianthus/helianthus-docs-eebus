name: Docs CI

"on":
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Classify validator self-test relevance
    # fork pull requests never run on the persistent runners
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'synology' }}
    timeout-minutes: 20
    outputs:
      validator_selftest: ${{ steps.classify.outputs.validator_selftest }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          fetch-depth: 2
          persist-credentials: false
      - id: classify
        name: Classify changed paths
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'validator_selftest=true' >> "$GITHUB_OUTPUT"
            exit 0
          else
            base="${{ github.event.before }}"
          fi
          if [ -n "$base" ] && [ -z "${base//0/}" ]; then
            echo 'validator_selftest=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" "${{ github.sha }}")"
          if grep -Eq '^((tests/)|(.github/workflows/.*\.(yml|yaml)$)|(requirements-ci\.txt$)|(scripts/))' <<<"$changed"; then
            echo 'validator_selftest=true' >> "$GITHUB_OUTPUT"
          else
            echo 'validator_selftest=false' >> "$GITHUB_OUTPUT"
          fi

  docs-fast:
    name: Docs fast checks
    # fork pull requests never run on the persistent runners
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'synology' }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          path: docs
          persist-credentials: false
      - name: Checkout exact MSP-055 source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          clean: true
          repository: Project-Helianthus/helianthus-eebusreg
          ref: 7a5852e009bbdcba47f0a34ba866070a4ab35ef8
          path: source
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"
      - name: Create job-local virtualenv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Set up exact MSP-055 Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.24.13"
          check-latest: false
          cache: false
      - name: Install pinned GitHub CLI
        run: |
          set -euo pipefail
          version=2.102.0
          sha256=bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386
          if command -v gh >/dev/null 2>&1 && [ "$(gh --version | awk 'NR==1 {print $3}')" = "${version}" ]; then
            exit 0
          fi
          archive="${RUNNER_TEMP}/gh_${version}_linux_amd64.tar.gz"
          mkdir -p "${RUNNER_TEMP}/bin"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/cli/cli/releases/download/v${version}/gh_${version}_linux_amd64.tar.gz"
          printf '%s  %s\n' "${sha256}" "${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" "gh_${version}_linux_amd64/bin/gh"
          mv "${RUNNER_TEMP}/gh_${version}_linux_amd64/bin/gh" "${RUNNER_TEMP}/bin/gh"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Install policy validator dependencies
        working-directory: docs
        run: 'python -m pip install --only-binary=:all: --require-hashes -r requirements-ci.txt'
      - name: Run naming contract tests
        working-directory: docs
        run: python3 -m unittest tests.test_naming_contract
      - name: Run fast docs CI
        working-directory: docs
        run: ./scripts/ci_docs_fast.sh
        env:
          MSP055_SOURCE_CHECKOUT: ${{ github.workspace }}/source
      - name: Verify MSP-055 online provenance
        working-directory: docs
        run: 'python3 scripts/validate_msp_055_api_freeze.py --source-checkout "$MSP055_SOURCE_CHECKOUT" --online'
        env:
          GH_TOKEN: ${{ github.token }}
          MSP055_SOURCE_CHECKOUT: ${{ github.workspace }}/source
      - name: Produce post-merge publication evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: docs
        run: |
          python scripts/render_publication.py render --repo . --output "$RUNNER_TEMP/publication" --evidence-core "$RUNNER_TEMP/publication-evidence.json" --source-commit "$GITHUB_SHA"
          python scripts/render_publication.py verify --repo . --output "$RUNNER_TEMP/publication" --source-commit "$GITHUB_SHA"
          python scripts/attest_publication.py --evidence-core "$RUNNER_TEMP/publication-evidence.json" --output "$RUNNER_TEMP/publication-attestation.json"

  validator-selftest:
    name: Validator self-tests
    needs: changes
    if: needs.changes.outputs.validator_selftest == 'true'
    # fork pull requests never run on the persistent runners
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'synology' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"
      - name: Create job-local virtualenv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Set up Go for producer probes
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.24.13"
          check-latest: false
          cache: false
      - name: Install policy validator dependencies
        run: 'python -m pip install --only-binary=:all: --require-hashes -r requirements-ci.txt'
      - name: Run validator self-tests
        run: ./scripts/ci_validator_selftest.sh

  platform-contracts-combined-ref:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule'
    uses: ./.github/workflows/platform-contracts-combined-ref.yml
    with:
      docs_repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
      docs_ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      docs_base_ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'schedule' && github.sha || github.event.before }}
      docs_eebus_ref: b9413bda992b99e4f719ad2e26e1937ff11a5b4a
      eebusreg_ref: 7c00bacbba34b796b79e64d7460cbeeb2f306553
      execution_plans_ref: fb384ab57d79f0020c54d2c66416e8a7666f0ceb
      enforce_through: MSP-DOCS-CLEAN

  markdown-checks:
    name: Platform contract checks
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'synology' }}
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: checkouts/receiver
          persist-credentials: false
      - name: Checkout push commit
        if: github.event_name != 'pull_request'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: checkouts/receiver
          persist-credentials: false
      - name: Checkout platform contracts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          repository: Project-Helianthus/helianthus-docs
          ref: ff8fccc7d5fbcbfe1e156fce302549d04a2f6228
          path: checkouts/docs
          persist-credentials: false
      - name: Checkout trusted docs prior manifest
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          repository: Project-Helianthus/helianthus-docs
          ref: ff8fccc7d5fbcbfe1e156fce302549d04a2f6228
          path: checkouts/docs-base
          persist-credentials: false
      - name: Checkout exact M6.25 trusted validator base
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          repository: Project-Helianthus/helianthus-docs-ebus
          ref: 8215201a4274db5310ee672619ba2f1d27b99bec
          path: checkouts/m625-trusted-base
          persist-credentials: false
      - name: Checkout M6.25 docs-eebus provenance
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          repository: Project-Helianthus/helianthus-docs-eebus
          ref: cedf238e34f879815ba773e9cd76b2b31c2822a3
          path: checkouts/m625-docs-eebus
          persist-credentials: false
      - name: Checkout M6.25 execution plans
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          repository: Project-Helianthus/helianthus-execution-plans
          ref: fb384ab57d79f0020c54d2c66416e8a7666f0ceb
          path: checkouts/m625-execution-plans
          persist-credentials: false
      - name: Checkout donor manifest
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          repository: Project-Helianthus/helianthus-docs-ebus
          ref: 977614c944cd685bef75b5b12148e1110ed7653a
          path: checkouts/docs-ebus
          persist-credentials: false
      - name: Materialize trusted prior manifest
        id: prior_manifest
        shell: bash
        env:
          TRUSTED_BASE_REF: ff8fccc7d5fbcbfe1e156fce302549d04a2f6228
        run: |
          set -euo pipefail
          base_root="${GITHUB_WORKSPACE}/checkouts/docs-base"
          manifest_path="docs/platform/manifests/eebus-doc-ownership.yaml"
          materialized_root="${RUNNER_TEMP}/helianthus-trusted-prior-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          materialized="${materialized_root}/eebus-doc-ownership.yaml"

          trusted_type="$(git -C "${base_root}" cat-file -t "${TRUSTED_BASE_REF}")"
          if [[ "${trusted_type}" != "commit" ]]; then
            exit 1
          fi
          trusted_commit="$(git -C "${base_root}" rev-parse --verify "${TRUSTED_BASE_REF}")"
          actual_commit="$(git -C "${base_root}" rev-parse --verify HEAD)"
          if [[ "${actual_commit}" != "${trusted_commit}" ]]; then
            exit 1
          fi

          IFS='/' read -r -a components <<< "${manifest_path}"
          prefix=""
          manifest_oid=""
          manifest_present=true
          last_index=$((${#components[@]} - 1))
          for index in "${!components[@]}"; do
            prefix="${prefix:+${prefix}/}${components[${index}]}"
            entry="$(git -C "${base_root}" ls-tree "${trusted_commit}" -- "${prefix}")"
            if [[ -z "${entry}" ]]; then
              manifest_present=false
              break
            fi
            metadata="${entry%%$'\t'*}"
            read -r mode object_type object_id <<< "${metadata}"
            if ((index < last_index)); then
              if [[ "${mode}" != "040000" || "${object_type}" != "tree" ]]; then
                exit 1
              fi
            else
              if [[ ! "${mode}" =~ ^100(644|755)$ || "${object_type}" != "blob" ]]; then
                exit 1
              fi
              manifest_oid="${object_id}"
            fi
          done

          if [[ "${manifest_present}" == "true" ]]; then
            umask 077
            mkdir -p "${materialized_root}"
            if [[ ! -d "${materialized_root}" || -L "${materialized_root}" ]]; then
              exit 1
            fi
            git -C "${base_root}" cat-file blob "${manifest_oid}" > "${materialized}"
            if [[ ! -f "${materialized}" || -L "${materialized}" ]]; then
              exit 1
            fi
            printf 'path=%s\n' "${materialized}" >> "${GITHUB_OUTPUT}"
          else
            printf 'path=\n' >> "${GITHUB_OUTPUT}"
          fi
      - name: Prepare hash-locked pip bootstrap
        run: |
          set -euo pipefail
          bootstrap_dir="${RUNNER_TEMP}/helianthus-pip-bootstrap"
          wheel="${bootstrap_dir}/pip-25.0.1-py3-none-any.whl"
          mkdir -p "${bootstrap_dir}"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "${wheel}.part" \
            https://files.pythonhosted.org/packages/c9/bc/b7db44f5f39f9d0494071bddae6880eb645970366d0a200022a1a93d57f5/pip-25.0.1-py3-none-any.whl
          printf '%s  %s\n' \
            c46efd13b6aa8279f33f2864459c8ce587ea6a1a59ee20de055868d8f7688f7f \
            "${wheel}.part" | sha256sum --check --strict
          mv "${wheel}.part" "${wheel}"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        env:
          PIP_FIND_LINKS: ${{ runner.temp }}/helianthus-pip-bootstrap
          PIP_NO_INDEX: "1"
        with:
          python-version: "3.12.10"
      - name: Create job-local virtualenv with hash-locked pip
        run: |
          set -euo pipefail
          wheel="${RUNNER_TEMP}/helianthus-pip-bootstrap/pip-25.0.1-py3-none-any.whl"
          rm -rf "${RUNNER_TEMP}/venv"
          python -m venv --without-pip "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/python" "${wheel}/pip" install \
            --no-index --no-deps --disable-pip-version-check "${wheel}"
          echo "${RUNNER_TEMP}/venv/bin" >> "${GITHUB_PATH}"
      - name: Verify pinned Python and pip
        run: |
          python - <<'PY'
          import importlib.metadata
          import sys

          if sys.version_info[:3] != (3, 12, 10):
              raise SystemExit("unexpected Python bootstrap version")
          if importlib.metadata.version("pip") != "25.0.1":
              raise SystemExit("unexpected pip bootstrap version")
          PY
      - name: Install copied-check dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps \
            --no-build-isolation --require-hashes \
            -r checkouts/docs/requirements-ci.txt
          python -m pip check
      - name: Set up Go (for santhosh-tekuri/jsonschema/cmd/jv)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.22.12"
          check-latest: false
          cache: false
      - name: Install jv (santhosh-tekuri/jsonschema CLI)
        run: |
          go install github.com/santhosh-tekuri/jsonschema/cmd/jv@v0.7.0
          echo "${HOME}/go/bin" >> "${GITHUB_PATH}"
      - name: Run copied platform contract checks
        working-directory: checkouts/receiver
        env:
          M625_TRUSTED_BASE_ROOT: ${{ github.workspace }}/checkouts/m625-trusted-base
          PLATFORM_DOCS_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          PLATFORM_CONTRACTS_ROOT: ${{ github.workspace }}/checkouts/docs
          DONOR_DOCS_ROOT: ${{ github.workspace }}/checkouts/docs-ebus
        run: ./scripts/ci_local.sh
