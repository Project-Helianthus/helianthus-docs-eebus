name: Docs CI

"on":
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Classify validator self-test relevance
    # fork pull requests never run on the persistent runners
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'synology' }}
    timeout-minutes: 20
    outputs:
      validator_selftest: ${{ steps.classify.outputs.validator_selftest }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          fetch-depth: 2
          persist-credentials: false
      - id: classify
        name: Classify changed paths
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -n "$base" ] && [ -z "${base//0/}" ]; then
            echo 'validator_selftest=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" "${{ github.sha }}")"
          if grep -Eq '^((tests/)|(.github/workflows/.*\.(yml|yaml)$)|(requirements-ci\.txt$)|(scripts/))' <<<"$changed"; then
            echo 'validator_selftest=true' >> "$GITHUB_OUTPUT"
          else
            echo 'validator_selftest=false' >> "$GITHUB_OUTPUT"
          fi

  docs-fast:
    name: Docs fast checks
    # fork pull requests never run on the persistent runners
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'synology' }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          path: docs
          persist-credentials: false
      - name: Checkout exact MSP-055 source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          clean: true
          repository: Project-Helianthus/helianthus-eebusreg
          ref: 7a5852e009bbdcba47f0a34ba866070a4ab35ef8
          path: source
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"
      - name: Create job-local virtualenv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Set up exact MSP-055 Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.24.13"
          check-latest: false
          cache: false
      - name: Install pinned GitHub CLI
        run: |
          set -euo pipefail
          version=2.102.0
          sha256=bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386
          if command -v gh >/dev/null 2>&1 && [ "$(gh --version | awk 'NR==1 {print $3}')" = "${version}" ]; then
            exit 0
          fi
          archive="${RUNNER_TEMP}/gh_${version}_linux_amd64.tar.gz"
          mkdir -p "${RUNNER_TEMP}/bin"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/cli/cli/releases/download/v${version}/gh_${version}_linux_amd64.tar.gz"
          printf '%s  %s\n' "${sha256}" "${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" "gh_${version}_linux_amd64/bin/gh"
          mv "${RUNNER_TEMP}/gh_${version}_linux_amd64/bin/gh" "${RUNNER_TEMP}/bin/gh"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Install policy validator dependencies
        working-directory: docs
        run: 'python -m pip install --only-binary=:all: --require-hashes -r requirements-ci.txt'
      - name: Run fast docs CI
        working-directory: docs
        run: ./scripts/ci_docs_fast.sh
        env:
          MSP055_SOURCE_CHECKOUT: ${{ github.workspace }}/source
      - name: Verify MSP-055 online provenance
        working-directory: docs
        run: 'python3 scripts/validate_msp_055_api_freeze.py --source-checkout "$MSP055_SOURCE_CHECKOUT" --online'
        env:
          GH_TOKEN: ${{ github.token }}
          MSP055_SOURCE_CHECKOUT: ${{ github.workspace }}/source
      - name: Produce post-merge publication evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: docs
        run: |
          python scripts/render_publication.py render --repo . --output "$RUNNER_TEMP/publication" --evidence-core "$RUNNER_TEMP/publication-evidence.json" --source-commit "$GITHUB_SHA"
          python scripts/render_publication.py verify --repo . --output "$RUNNER_TEMP/publication" --source-commit "$GITHUB_SHA"
          python scripts/attest_publication.py --evidence-core "$RUNNER_TEMP/publication-evidence.json" --output "$RUNNER_TEMP/publication-attestation.json"

  validator-selftest:
    name: Validator self-tests
    needs: changes
    if: needs.changes.outputs.validator_selftest == 'true'
    # fork pull requests never run on the persistent runners
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'synology' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"
      - name: Create job-local virtualenv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Set up Go for producer probes
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.24.13"
          check-latest: false
          cache: false
      - name: Install policy validator dependencies
        run: 'python -m pip install --only-binary=:all: --require-hashes -r requirements-ci.txt'
      - name: Run validator self-tests
        run: ./scripts/ci_validator_selftest.sh
