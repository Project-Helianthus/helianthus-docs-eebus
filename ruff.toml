# Retain Ruff's default rules explicitly alongside the readability ratchet.
required-version = "==0.15.10"

[lint]
select = ["E4", "E7", "E9", "F", "N", "C901", "PLR0915"]

# Initial reviewable defaults; these are not Board-mandated limits.
[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-statements = 50
